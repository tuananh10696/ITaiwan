<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITaiwan - Admin Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Be Vietnam Pro: đủ dấu tiếng Việt (xem ghi chú font ở src/css/style.css). Inter làm dự phòng. -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome SUBSET tự host: chỉ những icon dự án dùng (CLAUDE.md 4.32).
       Dùng chung file với cổng học viên; thêm icon mới -> `npm run data:fa`. -->
  <link rel="stylesheet" href="/fa/fa-subset.css">
  <link rel="stylesheet" href="/src/css/admin.css">
  <script>
    // PHẢI nằm trong <head> và chạy ĐỒNG BỘ, trước khi trình duyệt vẽ bất cứ thứ gì trong <body>.
    // Nếu đặt ở cuối <body> (như bản vá trước) thì #login-gate đã được parse + vẽ xong rồi mới bị ẩn
    // => vẫn thấy chớp màn đăng nhập mỗi lần F5.
    // Có token = phiên có thể còn hạn -> vào trạng thái "đang kiểm tra": ẩn form đăng nhập, hiện splash.
    // checkAuth() trong admin.js sẽ gỡ class này ra khi biết chắc kết quả.
    try {
      if (localStorage.getItem('tw_token')) {
        document.documentElement.classList.add('tw-auth-checking');
        // Chốt an toàn: nếu admin.js không tải được (mạng lỗi, chặn script...) thì splash sẽ treo
        // vĩnh viễn và người dùng không thấy cả form đăng nhập. Sau 10s tự trả về form đăng nhập.
        setTimeout(function () {
          document.documentElement.classList.remove('tw-auth-checking');
        }, 10000);
      }
    } catch (e) { /* trình duyệt chặn localStorage -> cứ hiện form đăng nhập như bình thường */ }
  </script>
</head>
<body>
  <!-- Splash "đang kiểm tra phiên đăng nhập": chỉ hiện khi <html> có class tw-auth-checking -->
  <div id="auth-splash" class="auth-splash">
    <div class="auth-splash-box">
      <img src="/favicon.png" alt="ITaiwan" width="64" height="64" class="brand-logo-img">
      <div><span class="logo-tw">ITaiwan</span><span class="logo-di">Admin</span></div>
      <div class="auth-splash-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>
    </div>
  </div>
  <!-- Login Gate -->
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <div class="login-logo">
        <img src="/favicon.png" alt="ITaiwan" width="44" height="44" class="brand-logo-img">
        <span class="logo-tw">ITaiwan</span><span class="logo-di">Admin</span>
        <span class="logo-badge">ADMIN</span>
      </div>
      <h2>Đăng nhập Quản trị</h2>
      <p class="login-desc">Chỉ tài khoản Admin mới có quyền truy cập.</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="admin@ten.vn" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-password" placeholder="••••••" autocomplete="current-password">
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button id="login-btn" class="btn btn-primary btn-full" onclick="adminApp.login()">
        <i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP
      </button>
    </div>
  </div>

  <!-- Admin Shell -->
  <div id="admin-shell" class="admin-shell" style="display:none">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="sidebar-header">
        <img src="/favicon.png" alt="ITaiwan" width="32" height="32" class="brand-logo-img">
        <div class="admin-logo">
          <span class="logo-tw">ITaiwan</span><span class="logo-di">Admin</span>
        </div>
        <span class="admin-badge" id="vai-tro-badge">ADMIN</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active" data-section="dashboard" onclick="adminApp.navigate('dashboard')">
          <i class="fa-solid fa-chart-line"></i> Tổng quan
        </div>

        <div class="nav-section-label">DẠY &amp; HỌC</div>
        <div class="nav-item" data-section="classes" onclick="adminApp.navigate('classes')">
          <i class="fa-solid fa-chalkboard-user"></i> Quản lý lớp
        </div>
        <!-- "Đề bài" giáo viên CÓ thấy (họ là người ra đề) nên không gắn thuộc tính nào. -->
        <div class="nav-item" data-section="de-bai" onclick="adminApp.navigate('de-bai')">
          <i class="fa-solid fa-file-pen"></i><span>Đề bài &amp; kiểm tra</span>
        </div>
        <div class="nav-item" data-section="teachers" data-tu-quan-tri onclick="adminApp.navigate('teachers')">
          <i class="fa-solid fa-chalkboard"></i> Giáo viên
        </div>
        <div class="nav-item" data-section="users" data-chi-admin onclick="adminApp.navigate('users')">
          <i class="fa-solid fa-users"></i> Học viên <span id="pending-badge" class="pending-badge" style="display:none"></span>
        </div>

        <!-- Hồ sơ du học: Nhận hồ sơ -> Đóng tiền -> Học -> Phỏng vấn -> Visa -> Bay.
             data-tu-quan-tri = quản trị. Giáo viên KHÔNG thấy, vì hồ sơ có CCCD / hộ chiếu /
             tiền nong (server cũng chặn, xem middleware/roles.js). -->
        <div class="nav-section-label" data-tu-quan-tri>DU HỌC</div>
        <div class="nav-item" data-section="du-hoc" data-tu-quan-tri onclick="adminApp.navigate('du-hoc')">
          <i class="fa-solid fa-plane-departure"></i> Hồ sơ du học
        </div>
        <div class="nav-item" data-section="ktx" data-tu-quan-tri onclick="adminApp.navigate('ktx')">
          <i class="fa-solid fa-bed"></i><span>Ký túc xá</span>
        </div>

        <div class="nav-section-label" data-tu-quan-tri>VẬN HÀNH</div>
        <div class="nav-item" data-section="quy" data-tu-quan-tri onclick="adminApp.navigate('quy')">
          <i class="fa-solid fa-wallet"></i><span>Sổ thu – chi</span>
        </div>
        <!-- Chống chia sẻ tài khoản: hàng chờ những lần đăng nhập bị chặn vì quá 2 thiết bị.
             Xem server/utils/thiet-bi.js. -->
        <div class="nav-item" data-section="thiet-bi" data-chi-admin onclick="adminApp.navigate('thiet-bi')">
          <i class="fa-solid fa-mobile-screen-button"></i> Thiết bị đăng nhập
          <span class="tt-badge" id="tb-badge" hidden></span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <a href="/" class="nav-item back-link"><i class="fa-solid fa-arrow-left"></i> Về trang học</a>
        <div class="nav-item logout-link" onclick="adminApp.logout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <button class="mobile-menu-btn" onclick="document.getElementById('admin-sidebar').classList.toggle('open')">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 id="section-title">Tổng quan</h1>
        <div class="header-right">
          <span id="admin-name" class="admin-user-name"></span>
        </div>
      </header>
      <div class="admin-content" id="admin-content">
        <!-- Dynamic content rendered here -->
      </div>
    </main>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
