# Header bảo mật cho trang HTML + tài nguyên tĩnh — chép 1:1 từ khối "headers" của vercel.json.
# Đặt ở /etc/nginx/snippets/itaiwan-headers.conf, và `include` trong TỪNG location có add_header
# riêng: nginx KHÔNG kế thừa add_header của cấp server khi location tự khai add_header — quên một
# chỗ là trang đó mất sạch CSP mà không có lỗi nào hiện ra.
#
# HSTS: bỏ `includeSubDomains; preload` so với Vercel — subdomain của hộp thư Vietnix có thể chỉ
# chạy http; preload rồi thì gỡ ra mất hàng tháng. Bật lại khi chắc mọi subdomain đều có HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://www.tiktok.com https://www.facebook.com https://www.instagram.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
