# nginx cho duhocitaiwan.com — thay vai trò của vercel.json khi chạy trên VPS.
#   /etc/nginx/sites-available/duhocitaiwan.com  (+ symlink vào sites-enabled)
#
# Phân vai:  nginx  -> file tĩnh trong /var/www/duhocitaiwan (bản build `dist/`), HTTPS, header, cache
#            Node   -> /api/* ở 127.0.0.1:3001 (PM2)
# Nội dung bài học trả phí KHÔNG nằm trong dist/ (plugin trong vite.config.js xoá khi build) —
# chỉ đi qua /api/noi-dung, đọc từ /srv/itaiwan/public/data.

# HTTP -> HTTPS (giữ đường cho certbot gia hạn chứng chỉ)
server {
    listen 80;
    listen [::]:80;
    server_name duhocitaiwan.com www.duhocitaiwan.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://duhocitaiwan.com$request_uri; }
}

# www -> apex
server {
    # Cú pháp "listen ... http2" thay cho "http2 on;": nginx 1.24 của Ubuntu 24.04 chưa có "http2 on;"
    # (có từ 1.25.1). Bản mới hơn chỉ cảnh báo deprecated, vẫn chạy.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.duhocitaiwan.com;

    ssl_certificate     /etc/letsencrypt/live/duhocitaiwan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duhocitaiwan.com/privkey.pem;

    return 301 https://duhocitaiwan.com$request_uri;
}

server {
    # Cú pháp "listen ... http2" thay cho "http2 on;": nginx 1.24 của Ubuntu 24.04 chưa có "http2 on;"
    # (có từ 1.25.1). Bản mới hơn chỉ cảnh báo deprecated, vẫn chạy.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name duhocitaiwan.com;

    ssl_certificate     /etc/letsencrypt/live/duhocitaiwan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duhocitaiwan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/duhocitaiwan;
    index index.html;

    # Ảnh chứng từ/ảnh câu hỏi là base64 trong JSON; Express nhận tối đa 6MB ở các nhánh đó.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # ---------------------------------------------------------------- API
    # Tác vụ định kỳ chỉ được gọi từ chính máy chủ (crontab -> 127.0.0.1:3001), không qua nginx.
    location ^~ /api/cron/ { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # GHI ĐÈ, không nối thêm ($proxy_add_x_forwarded_for): gioi-han.js và thiet-bi.js lấy
        # phần tử ĐẦU của X-Forwarded-For làm IP thật. Nối thêm thì client tự gửi header giả là
        # lách được giới hạn đăng nhập.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Header bảo mật của API do Express tự đặt (server/index.js); chỉ thêm HSTS.
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---------------------------------------------------------------- file tĩnh (theo vercel.json)
    location /assets/ {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(audio|splash|images)/ {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location /data/ {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location = /sw.js {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location ~ ^/manifest(-admin)?\.webmanifest$ {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        types { }
        default_type application/manifest+json;
    }

    # SPA: đường dẫn không phải file -> index.html (giống rewrite "/(.*)" của vercel.json).
    # HTML luôn hỏi lại server: index.html trỏ tới file /assets/ có hash, cache cũ = trang trắng
    # sau mỗi lần deploy.
    location / {
        include snippets/itaiwan-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
