# Cấu hình TẠM để xin chứng chỉ Let's Encrypt lần đầu (chưa có file cert thì bản đầy đủ
# duhocitaiwan.com.conf không qua được `nginx -t`). Dùng xong thay bằng bản đầy đủ — xem README.
server {
    listen 80;
    listen [::]:80;
    server_name duhocitaiwan.com www.duhocitaiwan.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { default_type text/plain; return 200 "duhocitaiwan.com dang duoc dung\n"; }
}
